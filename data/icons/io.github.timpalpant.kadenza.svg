<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A cadenza is the unaccompanied flourish near the close of a movement,
       and the fermata is the mark written over the bar where one begins: an
       arc held above a round dot.

       The arc is a filled crescent rather than a stroked path so it can taper
       the way engraved notation does — heaviest at the crown, thinning towards
       the ends. Two cubics with the same span do the work: the outer sweeps
       left to right with its controls at y=14, the inner returns with its
       controls at y=42, and the 5px steps at each end give the tips the blunt
       finish engraving uses instead of letting them vanish to a point. A
       three-quarter rule puts a cubic's apex at 90-0.75*(90-control), so the
       crown spans y=33 to y=54 and carries 21px of weight.

       The taper costs legibility at tray sizes, where the thin tips start to
       fade into the plate. That is the trade being made for the notation
       shape; a uniform stroke survives downsampling better if this ever needs
       to read at 16px more than it needs to read as a fermata.

       The dot is placed by eye rather than by arithmetic. The cavity is an
       arch, wider at its base than at its crown, so its visual mass sits below
       its bounding-box centre of 74.5, and a dot centred there reads as riding
       high. It sits at 83.25 instead, low enough that the arc reads as holding
       it rather than hovering over it.

       That is low enough to hang 0.5 below the arc's tips, so the mark's
       bottom edge is the dot's and not the crescent's: y=33 down to y=90.5,
       midpoint 61.75, hence the 2.25 nudge that lands the whole mark on the
       plate's centre of 64. Both numbers move if either shape does — lower the
       dot again and the bottom edge, the midpoint and the nudge all shift with
       it.

       The warm plate is a nod to Apple Music, whose catalog this plays, and
       stops short of its actual mark: a client should read as compatible with
       a service, not as issued by it. The AppStream branding tints in the
       metainfo are derived from these two stops and want re-deriving if they
       change. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff7d8c"/>
      <stop offset="1" stop-color="#e01046"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#plate)"/>
  <g transform="translate(0,2.25)">
    <path d="M25,90 C25,14 103,14 103,90 L98,90 C98,42 30,42 30,90 Z" fill="#ffffff"/>
    <circle cx="64" cy="81" r="9.5" fill="#ffffff"/>
  </g>
</svg>
