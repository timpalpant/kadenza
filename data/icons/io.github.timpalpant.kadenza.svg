<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A cadenza is the unaccompanied flourish near the close of a movement,
       and the fermata is the mark that sits over the bar where one begins:
       a dome held above a note. Reversed out of a plate rather than drawn as
       a bare silhouette, because the stroke is thin enough that it needs the
       contrast to survive a 16px tray icon.

       The warm plate is a nod to Apple Music, whose catalog this plays,
       stopping short of its actual mark — a client should read as compatible
       with a service, not as issued by it.

       The mark is centred on the plate by its bounding box: the dome's top
       (y=47 less half the stroke) to the lower cap (y=81 plus half), which
       puts the midpoint on 64. Move the arc and the note head together or
       it drifts off centre. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff7d8c"/>
      <stop offset="1" stop-color="#e01046"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#plate)"/>
  <path d="M30 81 A34 34 0 0 1 98 81" fill="none" stroke="#ffffff"
        stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="64" cy="73" rx="16" ry="12" transform="rotate(-20 64 73)" fill="#ffffff"/>
</svg>
