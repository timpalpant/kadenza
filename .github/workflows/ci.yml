name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git qt6-base qt6-declarative qt6-tools kirigami ki18n kcoreaddons kconfig knotifications kglobalaccel
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Verify install tree
        run: |
          DESTDIR="$PWD/staging" cmake --install build --prefix /usr
          test -x staging/usr/bin/kanzi
          test -f staging/usr/share/applications/io.github.timpalpant.kanzi.desktop
          test -f staging/usr/share/metainfo/io.github.timpalpant.kanzi.metainfo.xml
          test -f staging/usr/share/icons/hicolor/scalable/apps/io.github.timpalpant.kanzi.svg
          test -f staging/usr/share/kanzi/sidecar/main.js

  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git nodejs qt6-base qt6-declarative qt6-tools kirigami ki18n kcoreaddons kconfig knotifications kglobalaccel appstream desktop-file-utils
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: desktop-file-validate data/io.github.timpalpant.kanzi.desktop
      - run: appstreamcli validate --no-net data/io.github.timpalpant.kanzi.metainfo.xml
      - run: node --check sidecar/main.js && node --check sidecar/preload.js
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build --target all_qmllint

  format:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git clang
      - uses: actions/checkout@v7
      - run: find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  smoke:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel cmake ninja git qt6-base qt6-declarative kirigami ki18n kcoreaddons kconfig knotifications kglobalaccel qqc2-desktop-style breeze-icons
      - uses: actions/checkout@v7
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build
      - name: Load QML headlessly
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          timeout 15 ./build/kanzi > out.log 2>&1 || true
          cat out.log
          if grep -Eq 'is not a type|Cannot assign|ReferenceError|Binding loop|Cannot create delegate' out.log; then exit 1; fi
