app-id: io.github.timpalpant.kanzi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: kanzi

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.kanzi

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - '*.a'

modules:
  - name: kanzi
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
        skip: [build, sidecar/node_modules, .git, .flatpak-builder, build-flatpak, flatpak-repo]
      - type: archive
        url: https://github.com/castlabs/electron-releases/releases/download/v43.0.0%2Bwvcus/electron-v43.0.0+wvcus-linux-x64.zip
        sha256: 53782f44b8a88703ed54da1602c54c0af998ce076839f719efe1c850b05baccf
        strip-components: 0
        dest: electron-dist
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DBUILD_TESTING=OFF
      - cmake --build build
      - cmake --install build
      - mv /app/bin/kanzi /app/bin/kanzi.real
      - install -Dm755 packaging/flatpak/kanzi-launcher /app/bin/kanzi
      - mkdir -p /app/share/kanzi/sidecar/node_modules/electron/dist
      - cp -a electron-dist/. /app/share/kanzi/sidecar/node_modules/electron/dist/
      - mv /app/share/kanzi/sidecar/node_modules/electron/dist/electron /app/share/kanzi/sidecar/node_modules/electron/dist/electron.bin
      - chmod +x /app/share/kanzi/sidecar/node_modules/electron/dist/electron.bin
      - install -Dm755 packaging/flatpak/electron-shim /app/share/kanzi/sidecar/node_modules/electron/dist/electron

