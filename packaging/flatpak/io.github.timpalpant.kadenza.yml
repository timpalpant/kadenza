app-id: io.github.timpalpant.kadenza
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: kadenza

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.kadenza
  - --talk-name=org.kde.kglobalaccel

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - '*.a'

modules:
  - name: kadenza
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/timpalpant/kadenza.git
        tag: v0.3.0
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/castlabs/electron-releases/releases/download/v45.2.1%2Bwvcus/electron-v45.2.1+wvcus-linux-x64.zip
        sha256: 18953cdab1cdc2499f9b0089f85d069559bf992145008a40aacd0d7714b97960
        strip-components: 0
        dest: electron-dist
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/castlabs/electron-releases/releases/download/v45.2.1%2Bwvcus/electron-v45.2.1+wvcus-linux-arm64.zip
        sha256: 4eaa98ae93b98377f1fb3b8ab403a2132a301cd04f05322fcf4a90d29ac68ce1
        strip-components: 0
        dest: electron-dist
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DBUILD_TESTING=OFF
      - cmake --build build
      - cmake --install build
      - mv /app/bin/kadenza /app/bin/kadenza.real
      - install -Dm755 packaging/flatpak/kadenza-launcher /app/bin/kadenza
      - mkdir -p /app/share/kadenza/sidecar/node_modules/electron/dist
      - cp -a electron-dist/. /app/share/kadenza/sidecar/node_modules/electron/dist/
      - mv /app/share/kadenza/sidecar/node_modules/electron/dist/electron /app/share/kadenza/sidecar/node_modules/electron/dist/electron.bin
      - chmod +x /app/share/kadenza/sidecar/node_modules/electron/dist/electron.bin
      - install -Dm755 packaging/flatpak/electron-shim /app/share/kadenza/sidecar/node_modules/electron/dist/electron
