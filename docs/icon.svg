<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Kanzi is Swahili for "treasure", so the mark is a cut gem rather than
       another rounded-square tile: the silhouette alone tells it apart from
       every other media player in a launcher. Flat facets instead of
       gradients, and a lit crown over a shadowed pavilion, so the stone still
       reads as a stone once the facet lines are too small to resolve. -->
  <g>
    <!-- Crown: turned towards the light. -->
    <path d="M14 68 42 34 42 68Z" fill="#7d55ee"/>
    <path d="M42 34H86V68H42Z" fill="#9573ff"/>
    <path d="M86 34 114 68 86 68Z" fill="#6a41d8"/>
    <!-- Pavilion: falls away from it. -->
    <path d="M14 68H42L64 116Z" fill="#4e2bb4"/>
    <path d="M42 68H86L64 116Z" fill="#5f36cc"/>
    <path d="M86 68H114L64 116Z" fill="#3a1f93"/>
  </g>
  <!-- A level meter across the stone, so it reads as music and not jewellery. -->
  <g fill="#ffffff">
    <rect x="37" y="53" width="11" height="30" rx="5.5"/>
    <rect x="59" y="43" width="11" height="50" rx="5.5"/>
    <rect x="81" y="50" width="11" height="36" rx="5.5"/>
  </g>
</svg>
